<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore ThyToxicGamer's multi-platform game library."
    />
    <meta name="theme-color" content="#050706" />
    <title>ThyToxicGamer Game Library</title>
    <link rel="stylesheet" href="styles.css?v=5.4" />
    <link rel="stylesheet" href="dashboard.css?v=5.4" />
    <script src="games.js?v=5.4" defer></script>
    <script src="app.js?v=5.4" defer></script>
    <script src="dashboard.js?v=5.4" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#game-library">Skip to game library</a>

    <header class="site-header">
      <a class="brand" href="#top" aria-label="Return to the top">
        <span class="brand-mark" aria-hidden="true">☣</span>
        <span>
          <strong>ThyToxicGamer</strong>
          <small>Game Library</small>
        </span>
      </a>
      <div class="library-count" aria-label="Total games">
        <strong id="header-count">168</strong>
        <span>Total Games</span>
      </div>
      <div class="vault-mark" aria-label="The Toxic Vault">
        <span aria-hidden="true">☣</span>
        <strong>The Toxic Vault</strong>
      </div>
    </header>

    <main id="top">
      <section class="library-section" id="game-library" aria-labelledby="library-title">
        <div
          class="platform-tabs"
          id="platform-tabs"
          role="tablist"
          aria-label="Game platforms"
        ></div>

        <div
          class="platform-panel"
          id="platform-panel"
          role="tabpanel"
          aria-labelledby="tab-all"
          tabindex="0"
        >
          <div class="section-heading">
            <div>
              <p class="eyebrow">Full Collection</p>
              <h2 id="library-title">
                <span id="platform-name">All Games</span>
                <span class="count-chip" id="library-count">168 Games</span>
              </h2>
            </div>
          </div>

          <div class="game-grid" id="game-grid" aria-live="polite"></div>
          <div class="coming-soon-panel" id="xbox-coming-soon" hidden>
            <p class="eyebrow">Xbox Library</p>
            <h3>Coming Soon</h3>
            <p>Xbox games will be added here.</p>
          </div>
        </div>
        <noscript>
          <p class="noscript-message">
            JavaScript must be enabled to display the game library.
          </p>
        </noscript>
      </section>
    </main>

    <footer>
      <span aria-hidden="true">☣</span>
      <p>
        All game names, artwork, and trademarks belong to their respective
        owners.
      </p>
    </footer>
  </body>
</html>
